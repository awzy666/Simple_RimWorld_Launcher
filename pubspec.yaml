name: rimworld_launcher
description: Windows desktop library and Workshop manager for RimWorld.
publish_to: none
version: 0.4.4+10

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fluent_ui: ^4.15.0

  flutter_rust_bridge: 2.12.0
  ffi: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  ffigen: ^20.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/colony.png
